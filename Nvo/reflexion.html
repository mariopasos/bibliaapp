<script>
        // Micro-interaction for tag selection
        document.querySelectorAll('button.font-label').forEach(tag => {
            tag.addEventListener('click', function() {
                this.classList.toggle('bg-surface-container-high');
                this.classList.toggle('text-on-surface-variant');
                this.classList.toggle('bg-tertiary');
                this.classList.toggle('text-on-tertiary');
            });
        });

        // Simple typing effect for placeholder if empty (UX flourish)
        const editor = document.querySelector('.reflection-editor');
        editor.addEventListener('focus', () => {
            editor.parentElement.querySelector('div').classList.add('bg-primary/40');
        });
        editor.addEventListener('blur', () => {
            editor.parentElement.querySelector('div').classList.remove('bg-primary/40');
        });

        // Auto-expand textarea (minimal version)
        editor.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
    </script>
